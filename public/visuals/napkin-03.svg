<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Basel Compliance = Revenue Growth</text>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0" text-anchor="middle">DexMetal transboundary waste documentation</text>
  
  <!-- Top Stats Row -->
  <g transform="translate(100, 120)">
    <!-- Revenue Icon -->
    <circle cx="30" cy="30" r="25" fill="none" stroke="#00b4a6" stroke-width="3"/>
    <text x="30" y="25" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#00b4a6" text-anchor="middle">$</text>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00b4a6" text-anchor="middle">2.5M+</text>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">$2.5M+</text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Annual Revenue</text>
  </g>
  
  <g transform="translate(450, 120)">
    <!-- Profit Icon -->
    <polygon points="30,10 50,50 10,50" fill="none" stroke="#00b4a6" stroke-width="3"/>
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00b4a6" text-anchor="middle">40+</text>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">40%+</text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Profit Margins</text>
  </g>
  
  <!-- Middle Stats Row -->
  <g transform="translate(100, 230)">
    <!-- Globe Icon -->
    <circle cx="30" cy="30" r="25" fill="none" stroke="#00b4a6" stroke-width="3"/>
    <ellipse cx="30" cy="30" rx="12" ry="25" fill="none" stroke="#00b4a6" stroke-width="2"/>
    <line x1="5" y1="30" x2="55" y2="30" stroke="#00b4a6" stroke-width="2"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">128 Countries</text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Competent Authority Directory</text>
  </g>
  
  <g transform="translate(450, 230)">
    <!-- Clock Icon -->
    <circle cx="30" cy="30" r="25" fill="none" stroke="#00b4a6" stroke-width="3"/>
    <line x1="30" y1="30" x2="30" y2="15" stroke="#00b4a6" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="42" y2="30" stroke="#00b4a6" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="25" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">12-24 Weeks</text>
    <text x="90" y="45" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Basel Lead Time Required</text>
  </g>
  
  <!-- Case Study Box -->
  <rect x="100" y="320" width="600" height="90" fill="#1a1a1a" stroke="#00b4a6" stroke-width="2" rx="8"/>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00b4a6" text-anchor="middle">Real-World Win</text>
  <text x="400" y="368" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Bank computer removal: Competitors quoted $500-$800</text>
  <text x="400" y="388" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">DexMetal with full compliance: <tspan font-weight="bold" fill="#00b4a6">$2,400 won contract</tspan></text>
  <text x="400" y="403" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0" text-anchor="middle">Result: $28K revenue + six-figure referrals</text>
  
  <!-- CTA -->
  <rect x="280" y="440" width="240" height="40" fill="#00b4a6" rx="6"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0a0a0a" text-anchor="middle">dexmetal.com</text>
</svg>