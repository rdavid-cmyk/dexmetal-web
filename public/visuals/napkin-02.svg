<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Three Paths for Caribbean eWaste Operators</text>
  
  <!-- Column 1: Shut Down -->
  <rect x="30" y="80" width="220" height="380" fill="#1a1a1a" stroke="#333333" stroke-width="2" rx="8"/>
  <text x="140" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Option 1</text>
  <text x="140" y="135" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0" text-anchor="middle">Shut Down</text>
  
  <text x="140" y="180" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">✕</text>
  <text x="140" y="210" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Lose everything</text>
  <text x="140" y="240" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Exit the market</text>
  <text x="140" y="270" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Zero revenue</text>
  <text x="140" y="300" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Business closure</text>
  
  <text x="140" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff4444" text-anchor="middle">Not Viable</text>
  
  <!-- Column 2: Junior Partner -->
  <rect x="290" y="80" width="220" height="380" fill="#1a1a1a" stroke="#333333" stroke-width="2" rx="8"/>
  <text x="400" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Option 2</text>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="16" fill="#a0a0a0" text-anchor="middle">Junior Partner</text>
  
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Partner with</text>
  <text x="400" y="200" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">compliant operator</text>
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Lower margins</text>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">Permanent</text>
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">dependency</text>
  <text x="400" y="330" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Limited control</text>
  
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff9944" text-anchor="middle">Survival Mode</text>
  
  <!-- Column 3: Master Compliance (Highlighted) -->
  <rect x="550" y="80" width="220" height="380" fill="#1a1a1a" stroke="#00b4a6" stroke-width="3" rx="8"/>
  <rect x="550" y="80" width="220" height="50" fill="#00b4a6" rx="8"/>
  <rect x="550" y="127" width="220" height="3" fill="#00b4a6"/>
  
  <text x="660" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0a0a0a" text-anchor="middle">Option 3 ✓</text>
  <text x="660" y="150" font-family="Arial, sans-serif" font-size="16" fill="#00b4a6" text-anchor="middle">Master Compliance</text>
  
  <text x="660" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00b4a6" text-anchor="middle">Investment:</text>
  <text x="660" y="205" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">$67K over 18 months</text>
  
  <text x="660" y="240" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00b4a6" text-anchor="middle">Return:</text>
  <text x="660" y="260" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">$300K additional</text>
  <text x="660" y="278" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">revenue in 2 years</text>
  
  <text x="660" y="313" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#00b4a6" text-anchor="middle">Premium:</text>
  <text x="660" y="333" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">15-25% higher pricing</text>
  <text x="660" y="351" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">from corporate clients</text>
  
  <rect x="570" y="380" width="180" height="60" fill="#00b4a6" rx="6"/>
  <text x="660" y="405" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0a0a0a" text-anchor="middle">CHOSEN PATH</text>
  <text x="660" y="425" font-family="Arial, sans-serif" font-size="13" fill="#0a0a0a" text-anchor="middle">Long-term competitive</text>
  <text x="660" y="440" font-family="Arial, sans-serif" font-size="13" fill="#0a0a0a" text-anchor="middle">advantage achieved</text>
</svg>