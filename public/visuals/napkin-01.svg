<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">
    The Cost of Compliance Failure in eWaste Operations
  </text>
  
  <!-- Divider line -->
  <line x1="100" y1="60" x2="700" y2="60" stroke="#00b4a6" stroke-width="2"/>
  
  <!-- Main visual: Money flow disruption -->
  <!-- Before state -->
  <g id="before">
    <text x="150" y="100" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0" text-anchor="middle">BEFORE</text>
    <rect x="100" y="110" width="100" height="80" fill="none" stroke="#00b4a6" stroke-width="2" rx="5"/>
    <text x="150" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00b4a6" text-anchor="middle">$20K</text>
    <text x="150" y="170" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0" text-anchor="middle">/month</text>
    <text x="150" y="185" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0" text-anchor="middle">steady revenue</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 210 150 L 270 150" stroke="#00b4a6" stroke-width="3" fill="none"/>
  <path d="M 270 150 L 260 145 L 260 155 Z" fill="#00b4a6"/>
  
  <!-- Problem icon -->
  <g id="warning">
    <circle cx="320" cy="150" r="35" fill="#ff3333" opacity="0.2"/>
    <path d="M 320 130 L 330 165 L 310 165 Z" fill="#ff3333" stroke="#ff3333" stroke-width="2"/>
    <circle cx="320" cy="160" r="2" fill="#ffffff"/>
    <line x1="320" y1="140" x2="320" y2="152" stroke="#ffffff" stroke-width="3"/>
    <text x="320" y="200" font-family="Arial, sans-serif" font-size="11" fill="#ff3333" text-anchor="middle">Basel Non-Compliance</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 370 150 L 430 150" stroke="#ff3333" stroke-width="3" fill="none"/>
  <path d="M 430 150 L 420 145 L 420 155 Z" fill="#ff3333"/>
  
  <!-- After state -->
  <g id="after">
    <text x="530" y="100" font-family="Arial, sans-serif" font-size="14" fill="#a0a0a0" text-anchor="middle">AFTER</text>
    <rect x="480" y="110" width="100" height="80" fill="none" stroke="#ff3333" stroke-width="2" rx="5"/>
    <text x="530" y="145" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ff3333" text-anchor="middle">$6K</text>
    <text x="530" y="170" font-family="Arial, sans-serif" font-size="12" fill="#a0a0a0" text-anchor="middle">/month</text>
    <text x="530" y="185" font-family="Arial, sans-serif" font-size="11" fill="#a0a0a0" text-anchor="middle">70% revenue drop</text>
  </g>
  
  <!-- Key stats boxes -->
  <g id="stat1">
    <rect x="80" y="250" width="200" height="100" fill="#1a1a1a" stroke="#00b4a6" stroke-width="2" rx="5"/>
    <text x="180" y="285" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ff3333" text-anchor="middle">$140K</text>
    <text x="180" y="310" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Outstanding invoices</text>
    <text x="180" y="330" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">from shutdown buyer</text>
  </g>
  
  <g id="stat2">
    <rect x="300" y="250" width="200" height="100" fill="#1a1a1a" stroke="#00b4a6" stroke-width="2" rx="5"/>
    <text x="400" y="285" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ff3333" text-anchor="middle">-70%</text>
    <text x="400" y="310" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Immediate revenue</text>
    <text x="400" y="330" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">collapse overnight</text>
  </g>
  
  <g id="stat3">
    <rect x="520" y="250" width="200" height="100" fill="#1a1a1a" stroke="#00b4a6" stroke-width="2" rx="5"/>
    <text x="620" y="285" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ff3333" text-anchor="middle">100%</text>
    <text x="620" y="310" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">Of past shipments</text>
    <text x="620" y="330" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0" text-anchor="middle">potentially illegal</text>
  </g>
  
  <!-- Bottom consequences -->
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">CASCADE OF CONSEQUENCES</text>
  
  <g id="consequences">
    <!-- Criminal liability -->
    <circle cx="150" cy="435" r="5" fill="#ff3333"/>
    <text x="165" y="440" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Criminal liability exposure</text>
    
    <!-- Asset seizure -->
    <circle cx="150" cy="460" r="5" fill="#ff3333"/>
    <text x="165" y="465" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Potential asset seizure</text>
    
    <!-- Maxed credit -->
    <circle cx="450" cy="435" r="5" fill="#ff3333"/>
    <text x="465" y="440" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Maxed personal credit cards</text>
    
    <!-- Survival mode -->
    <circle cx="450" cy="460" r="5" fill="#ff3333"/>
    <text x="465" y="465" font-family="Arial, sans-serif" font-size="13" fill="#a0a0a0">Survival mode operations</text>
  </g>
</svg>