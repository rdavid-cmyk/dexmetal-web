            - generic [ref=e22]: Block 1 – Quick Reference
            - generic [ref=e23]: Exporter-Notifier Registration
            - generic [ref=e24]: Identifies the legally accountable notifier responsible for initiating and managing the transboundary movement.
            - generic [ref=e25]:
              - generic [ref=e26]:
                - generic [ref=e27]: Basel Basis
                - generic [ref=e28]: vCOP8 Section IV
              - generic [ref=e29]:
                - generic [ref=e30]: ID Type
                - generic [ref=e31]: Exporter registration number
              - generic [ref=e32]:
                - generic [ref=e33]: Required For
                - generic [ref=e34]: All Basel notifications
          - heading "What Block 1 Captures" [level=2] [ref=e35]
          - paragraph [ref=e36]: The Exporter-Notifier Registration block is the regulatory anchor of any Basel notification. It identifies the legal entity responsible for the accuracy of the filing and compliance of the movement.
          - paragraph [ref=e37]: This entity remains legally accountable for the waste from origin until formal acceptance by the disposal or recovery facility. Under vCOP8 guidance, the notifier may be the waste generator, a recognized trader, or a competent authority of the State of export.
          - heading "How to Complete Block 1" [level=2] [ref=e38]
          - list [ref=e39]:
            - listitem [ref=e40]:
              - strong [ref=e41]: Enter the full legal entity name.
              - generic [ref=e42]: Match official business registration records exactly.
            - listitem [ref=e43]:
              - strong [ref=e44]: Add the valid registration number.
              - generic [ref=e45]: Use the currently active identifier issued in the State of export.
            - listitem [ref=e46]:
              - strong [ref=e47]: Provide the registered physical address.
              - generic [ref=e48]: Use headquarters or legal address, not warehouse or logistics addresses.
            - listitem [ref=e49]:
              - strong [ref=e50]: Include direct contact details.
              - generic [ref=e51]: Add phone, fax, email, and a designated contact person authorized to manage the notification.
          - generic [ref=e52]:
            - generic [ref=e53]: Notifier Identity Must Match Registration
            - generic [ref=e54]: Do not list a dispatch warehouse, broker, or logistics provider as the notifier unless they hold legal standing. Block 1 must reflect the registered entity that is legally liable for the movement.
